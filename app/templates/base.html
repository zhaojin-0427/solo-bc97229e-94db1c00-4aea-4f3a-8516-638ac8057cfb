<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}海洋温度子集提取{% endblock %}</title>
  <style>
    :root { --bd:#d8dee6; --bg:#f5f7fa; --pri:#1f6feb; --ok:#1a7f37; --err:#cf222e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", "PingFang SC",
           "Microsoft YaHei", sans-serif; background:var(--bg); color:#1f2328; }
    header { background:#0b2545; color:#fff; padding:18px 28px; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:6px 0 0; font-size:13px; opacity:.85; }
    main { max-width:980px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid var(--bd); border-radius:10px;
            padding:20px 24px; margin-bottom:20px; }
    h2 { font-size:16px; margin:0 0 14px; }
    label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
    input[type=text], input[type=number], input[type=datetime-local],
    input[type=file] { width:100%; padding:8px 10px; border:1px solid var(--bd);
            border-radius:6px; font-size:14px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .hint { font-size:12px; color:#57606a; margin-top:3px; }
    button { margin-top:18px; background:var(--pri); color:#fff; border:0;
             padding:10px 22px; border-radius:6px; font-size:14px; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--bd); }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px;
             font-size:12px; font-weight:600; }
    .QUEUED { background:#ddf4ff; color:#0969da; }
    .RUNNING { background:#fff8c5; color:#9a6700; }
    .SUCCEEDED { background:#dafbe1; color:var(--ok); }
    .FAILED { background:#ffebe9; color:var(--err); }
    a { color:var(--pri); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .err { color:var(--err); white-space:pre-wrap; font-size:13px;
           background:#ffebe9; border:1px solid #ffc1c1; padding:12px;
           border-radius:8px; }
    .bar { background:#eaeef2; border-radius:999px; height:10px; overflow:hidden; }
    .bar > div { background:var(--pri); height:100%; width:0; transition:width .4s; }
    code { background:#eef1f4; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
<header>
  <h1>海洋研究 · 跨日 NetCDF 温度子集提取</h1>
  <p>上传每日归档，按时间 / 纬度 / [-180,180) 经度闭区间选取，分块流式合并为单个 NetCDF</p>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
